<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gaslands Team Builder</title>
    <style>
      :root {
       --bg: #0f0d0c;
       --panel: #1d1a19;
       --panel-strong: #2a221f;
       --accent: #ff8b2a;
       --accent-soft: #ffd3a3;
       --text: #f7efe6;
       --muted: #d2bfae;
       --danger: #d64b2a;
       --success: #a8d77b;
       --line: rgba(255,255,255,0.09);
      }

      * { box-sizing: border-box; }

      body {
       margin: 0;
       min-height: 100vh;
       font-family: Arial, Helvetica, sans-serif;
       background:
         radial-gradient(circle at top, rgba(255,139,42,0.2), transparent 28%),
         linear-gradient(180deg, #140f0d 0%, #0f0d0c 100%);
       color: var(--text);
      }

      .page {
       max-width: 1200px;
       margin: 0 auto;
       padding: 32px 20px 52px;
      }

      .topbar {
       display: flex;
       align-items: center;
       justify-content: space-between;
       gap: 20px;
       margin-bottom: 24px;
       border-bottom: 1px solid var(--line);
       padding-bottom: 12px;
      }

      .print-actions {
       display: flex;
       align-items: center;
       gap: 10px;
       flex-wrap: wrap;
      }

      .secondary-btn {
       border: 1px solid rgba(255,255,255,0.18);
       background: rgba(255,255,255,0.03);
       color: var(--text);
      }

      .action-row {
       display: flex;
       flex-wrap: wrap;
       gap: 8px;
       margin-top: 14px;
      }

      .edit-btn,
      .delete-btn {
       padding: 8px 10px;
       font-size: 0.72rem;
       letter-spacing: 0.06em;
      }

      .edit-btn {
       background: rgba(255, 139, 42, 0.14);
       border: 1px solid rgba(255, 139, 42, 0.5);
       color: var(--accent-soft);
      }

      .delete-btn {
       background: rgba(214, 75, 42, 0.14);
       border: 1px solid rgba(214, 75, 42, 0.5);
       color: #ffd7cf;
      }

      .brand {
       font-size: clamp(1.8rem, 2vw, 2.5rem);
       font-weight: 800;
       letter-spacing: 0.08em;
       text-transform: uppercase;
      }

      .brand span {
       color: var(--accent);
      }

      .tag {
       padding: 6px 12px;
       border: 1px solid rgba(255, 139, 42, 0.45);
       border-radius: 999px;
       color: var(--accent-soft);
       background: rgba(255, 139, 42, 0.08);
       font-size: 0.8rem;
       letter-spacing: 0.08em;
       text-transform: uppercase;
      }

      .stats {
       display: grid;
       grid-template-columns: repeat(auto-fit, minmax(170px, 1fr));
       gap: 16px;
       margin-bottom: 26px;
      }

      .stat {
       background: rgba(29, 26, 25, 0.92);
       border: 1px solid var(--line);
       border-radius: 14px;
       padding: 18px 18px 16px;
      }

      .stat-label {
       color: var(--muted);
       text-transform: uppercase;
       letter-spacing: 0.08em;
       font-size: 0.72rem;
      }

      .stat-value {
       padding-top: 8px;
       font-size: clamp(1.6rem, 2vw, 2.2rem);
       font-weight: 700;
      }

      .layout {
       display: grid;
       grid-template-columns: 380px minmax(0, 1fr);
       gap: 24px;
      }

      .panel {
       background: rgba(29, 26, 25, 0.92);
       border: 1px solid var(--line);
       border-radius: 18px;
       overflow: hidden;
      }

      .panel-header {
       padding: 18px 20px;
       border-bottom: 1px solid var(--line);
       background: rgba(42, 34, 31, 0.9);
       font-weight: 700;
       text-transform: uppercase;
       letter-spacing: 0.08em;
      }

      .builder {
       padding: 20px;
      }

      .field-grid {
       display: grid;
       gap: 16px;
      }

      .field {
       display: grid;
       gap: 8px;
      }

      label {
       color: var(--muted);
       font-size: 0.82rem;
       letter-spacing: 0.04em;
       text-transform: uppercase;
      }

      input, select, textarea, button {
       font: inherit;
      }

      input, select, textarea {
       width: 100%;
       border: 1px solid rgba(255,255,255,0.12);
       background: rgba(15, 13, 12, 0.8);
       color: var(--text);
       border-radius: 10px;
       padding: 11px 12px;
      }

      textarea {
       min-height: 90px;
       resize: vertical;
      }

      button {
       border: 0;
       border-radius: 10px;
       background: linear-gradient(135deg, var(--accent), #d86016);
       color: #1b120e;
       font-weight: 800;
       letter-spacing: 0.06em;
       text-transform: uppercase;
       padding: 12px 16px;
       cursor: pointer;
      }

      .cards {
       padding: 20px;
       display: grid;
       grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
       gap: 18px;
      }

      .sponsor-strip {
       grid-column: 1 / -1;
       background: rgba(42, 34, 31, 0.9);
       border: 1px solid var(--line);
       border-radius: 16px;
       padding: 18px;
      }

      .sponsor-strip h4 {
       margin: 0 0 12px;
       font-size: 0.8rem;
       text-transform: uppercase;
       letter-spacing: 0.08em;
       color: var(--accent-soft);
      }

      .sponsor-list {
       display: grid;
       grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
       gap: 10px 16px;
       color: var(--muted);
      }

      .sponsor-list strong {
       color: var(--text);
      }

      .vehicle-card {
       background: linear-gradient(180deg, rgba(32,27,24,0.9), rgba(20,18,16,0.95));
       border: 1px solid var(--line);
       border-radius: 16px;
       padding: 18px;
       position: relative;
      }

      .vehicle-card h3 {
       margin: 0 0 8px;
       font-size: 1.35rem;
      }

      .meta {
       color: var(--muted);
       text-transform: uppercase;
       letter-spacing: 0.06em;
       font-size: 0.7rem;
       margin-bottom: 10px;
      }

      .chip-row {
       display: flex;
       flex-wrap: wrap;
       gap: 8px;
       margin: 14px 0 0;
      }

      .chip {
       border-radius: 999px;
       background: rgba(255, 139, 42, 0.12);
       border: 1px solid rgba(255, 139, 42, 0.35);
       padding: 5px 9px;
       font-size: 0.72rem;
       color: var(--accent-soft);
      }

      .badge {
       position: absolute;
       top: 14px;
       right: 14px;
       border-radius: 999px;
       background: rgba(168, 215, 123, 0.12);
       color: var(--success);
       border: 1px solid rgba(168, 215, 123, 0.35);
       padding: 6px 8px;
       font-size: 0.7rem;
       font-weight: 700;
       text-transform: uppercase;
      }

      @media (max-width: 820px) {
       .layout {
         grid-template-columns: 1fr;
       }

       .topbar {
         align-items: flex-start;
         flex-direction: column;
       }
      }

      @media print {
       @page {
         margin: 0.5in;
         size: A4 portrait;
       }

       body {
         background: #fff;
         color: #111;
       }

       .page {
         max-width: none;
         padding: 0;
       }

       .topbar,
       .stats,
       .layout > aside,
       .secondary-btn {
         display: none !important;
       }

       .panel {
         background: #fff;
         border: 1px solid #d3d3d3;
         box-shadow: none;
       }

       .cards {
         grid-template-columns: repeat(2, minmax(220px, 1fr));
         gap: 12px;
         padding: 0;
       }

       .vehicle-card,
       .sponsor-strip {
         background: #fff;
         color: #111;
         border: 1px solid #d3d3d3;
         break-inside: avoid;
       }

       .chip,
       .badge {
         background: #f4f4f4;
         color: #111;
         border-color: #d3d3d3;
       }

       .meta,
       .sponsor-list,
       .vehicle-card p,
       .vehicle-card div {
         color: #111;
       }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
       <div class="brand">Gaslands <span>Builder</span></div>
       <div class="print-actions">
         <div class="tag">Garage roster</div>
         <button class="secondary-btn" id="printRaceSheet" type="button">Print / Save as PDF</button>
       </div>
      </header>

      <section class="stats" aria-label="garage summary">
       <div class="stat">
         <div class="stat-label">Vehicles</div>
         <div class="stat-value" id="vehicleCount">0</div>
       </div>
       <div class="stat">
         <div class="stat-label">Crew</div>
         <div class="stat-value" id="crewTotal">0</div>
       </div>
       <div class="stat">
         <div class="stat-label">Avg. armor</div>
         <div class="stat-value" id="armorAverage">0</div>
       </div>
       <div class="stat">
         <div class="stat-label">Top gear</div>
         <div class="stat-value" id="speedPeak">0</div>
       </div>
      </section>

      <main class="layout">
       <aside class="panel">
         <div class="panel-header">Build a rig</div>
         <form class="builder" id="vehicleForm">
           <div class="field-grid">
             <div class="field">
               <label for="name">Vehicle name</label>
               <input id="name" name="name" type="text" value="Wrecking Ball" required />
             </div>

             <div class="field">
               <label for="chassis">Chassis</label>
               <select id="chassis" name="chassis">
                 <option>Buggy</option>
                 <option>Truck</option>
                 <option>Armoured van</option>
                 <option>Hover bike</option>
                 <option>Battle wagon</option>
               </select>
             </div>

             <div class="field">
               <label for="crew">Crew</label>
               <input id="crew" name="crew" type="number" min="1" max="8" value="3" required />
             </div>

             <div class="field">
               <label for="armor">Armor</label>
               <input id="armor" name="armor" type="number" min="1" max="6" value="4" required />
             </div>

             <div class="field">
               <label for="speed">Speed</label>
               <input id="speed" name="speed" type="number" min="1" max="10" value="7" required />
             </div>

             <div class="field">
               <label for="weapon">Weapon</label>
               <input id="weapon" name="weapon" type="text" value="Twin-linked machine guns" required />
             </div>

             <div class="field">
               <label for="notes">Special rules</label>
               <textarea id="notes" name="notes">Roll 5+ to ignore a ram hit. Loves chaos.</textarea>
             </div>

             <button type="submit">Add to roster</button>
           </div>
         </form>
       </aside>

       <section class="panel">
         <div class="panel-header">Garage</div>
         <div class="cards" id="vehicleCards" aria-live="polite"></div>
       </section>
      </main>
    </div>

    <script>
      const fullVehicleInventory = [
       { name: 'Buggy', type: 'Buggy', maxGear: 4, handling: 5, crew: 2, weight: 2, armour: 0, hull: 6, buildSlots: 2, cost: 18, specialRules: ['Roll Cage'] },
       { name: 'Hot Rod', type: 'Hot Rod', maxGear: 5, handling: 3, crew: 1, weight: 2, armour: 0, hull: 6, buildSlots: 2, cost: 15, specialRules: ['V8'] },
       { name: 'Muscle Car', type: 'Muscle Car', maxGear: 6, handling: 3, crew: 2, weight: 4, armour: 1, hull: 10, buildSlots: 3, cost: 24, specialRules: ['V8'] },
       { name: 'Passenger Car', type: 'Passenger Car', maxGear: 4, handling: 4, crew: 2, weight: 3, armour: 1, hull: 10, buildSlots: 4, cost: 18, specialRules: [] },
       { name: 'Pickup', type: 'Pickup', maxGear: 4, handling: 3, crew: 3, weight: 5, armour: 1, hull: 12, buildSlots: 5, cost: 20, specialRules: [] },
       { name: 'Sports Car', type: 'Sports Car', maxGear: 6, handling: 5, crew: 1, weight: 3, armour: 0, hull: 8, buildSlots: 2, cost: 26, specialRules: [] },
       { name: 'Van', type: 'Van', maxGear: 3, handling: 3, crew: 4, weight: 5, armour: 2, hull: 12, buildSlots: 5, cost: 22, specialRules: ['Cargo Space'] },
       { name: 'Bike', type: 'Bike', maxGear: 6, handling: 5, crew: 1, weight: 1, armour: 0, hull: 4, buildSlots: 1, cost: 15, specialRules: ['Rip It'] },
       { name: 'Monster Truck', type: 'Monster Truck', maxGear: 5, handling: 4, crew: 2, weight: 6, armour: 1, hull: 12, buildSlots: 2, cost: 20, specialRules: ['All Terrain', 'Up And Over'] },
       { name: 'Heavy Truck', type: 'Heavy Truck', maxGear: 3, handling: 3, crew: 4, weight: 8, armour: 3, hull: 16, buildSlots: 6, cost: 30, specialRules: ['Large Target', 'Sluggish'] },
       { name: 'Bus', type: 'Bus', maxGear: 3, handling: 3, crew: 8, weight: 7, armour: 2, hull: 16, buildSlots: 3, cost: 30, specialRules: ['Large Target', 'Sluggish'] },
       { name: 'Gyrocopter', type: 'Gyrocopter', maxGear: 6, handling: 4, crew: 1, weight: 2, armour: 0, hull: 4, buildSlots: 2, cost: 15, specialRules: ['Airborne'] },
       { name: 'Helicopter', type: 'Helicopter', maxGear: 4, handling: 4, crew: 3, weight: 6, armour: 2, hull: 8, buildSlots: 4, cost: 30, specialRules: ['Airborne'] },
       { name: 'Tank', type: 'Tank', maxGear: 3, handling: 3, crew: 3, weight: 10, armour: 5, hull: 16, buildSlots: 5, cost: 36, specialRules: ['All Terrain', 'Large Target', 'Up And Over', 'Pivot', 'Ponderous'] },
       { name: 'War Rig', type: 'War Rig', maxGear: 3, handling: 3, crew: 6, weight: 10, armour: 4, hull: 20, buildSlots: 8, cost: 40, specialRules: ['Articulated', 'Large Target', 'Ponderous', 'Sluggish'] }
      ];

      const STORAGE_KEY = 'gaslands-garage-roster-v1';
      let editingVehicleIndex = null;

      function loadVehicles() {
       try {
         const saved = localStorage.getItem(STORAGE_KEY);
         if (!saved) return [];
         const parsed = JSON.parse(saved);
         return Array.isArray(parsed) ? parsed : [];
       } catch (error) {
         return [];
       }
      }

      function saveVehicles() {
       localStorage.setItem(STORAGE_KEY, JSON.stringify(vehicles));
      }

      const vehicles = loadVehicles();
      const vehicleCards = document.getElementById('vehicleCards');
      const vehicleForm = document.getElementById('vehicleForm');

      const sponsorCatalog = [
       { sponsor: 'Chivo', requirement: 'Total cost of every vehicle in the team is 25+ cans', perk: 'Lowrider: +1 Handling while this vehicle has no Hazard tokens' },
       { sponsor: 'Highway Patrol', requirement: "Team's combined Max Gear is 10+", perk: 'Rear View Mirror: gain 2 Hazards for a forced move reaction vs. an enemy that placed 3+ templates' },
       { sponsor: 'Idris', requirement: 'Every vehicle in the team has Max Gear 6', perk: 'Ludicrous Speed: suffer 2 dmg to reactivate after ending in Gear 6; NO2 Addict: Nitro Boosters get +1 Ammo' },
       { sponsor: 'Inferno', requirement: 'Team includes 3+ weapons with the Fire rule', perk: 'Flame Trails: leave burning movement templates behind while On Fire' },
       { sponsor: 'Jumbo', requirement: 'Every vehicle in the team is Weight 5+', perk: 'Goliath: split a Weight 6+ vehicle activation across the round; Haulage: Trailers count as common (1 per vehicle)' },
       { sponsor: 'Maxxine', requirement: 'Every vehicle in the team has Handling 5', perk: 'Skiing: skip the Lose Control step on a wipeout' },
       { sponsor: 'Miyazaki', requirement: 'Every vehicle in the team has 3+ perks', perk: 'Powerslide: use almost any template in place of the Slide template' },
       { sponsor: 'Mishkin', requirement: 'Team includes 3+ rare weapons and/or upgrades', perk: 'Dynamo: reload Electrical Ammo after ending in Max Gear; Thumpermonkey: Electrical gear counts as common' },
       { sponsor: 'Rusty', requirement: 'Team includes 5+ upgrades', perk: 'Cattle-Hammer (purchasable, 4 cans): Crits on 5+ while 6+ Hazards; Haulage: Trailers count as common' },
       { sponsor: 'Rutherford', requirement: 'Team includes 5+ shooting weapons (excluding handguns)', perk: 'Snap Shot: gain 2 Hazards to make a reactive shooting attack at the end of an enemy attack step' },
       { sponsor: 'Scarlett', requirement: "Team's combined Crew is 8+", perk: 'Boarding Party: suffer 1 dmg for bonus Smash Dice equal to your Crew advantage (max +5)' },
       { sponsor: 'Slime', requirement: 'Every vehicle in the team has 1+ upgrades', perk: 'Pinball: gain 1 Hazard to shunt yourself along with the vehicle you shunt' },
       { sponsor: 'Verney', requirement: 'Every vehicle in the team has 2+ different dropped weapons', perk: 'Pickle Button: drop a weapon while moving; Trunk of Junk: attack with a 2nd dropped weapon per activation' },
       { sponsor: 'The Warden', requirement: 'Every vehicle in the team has Hull 10+', perk: 'Criminal Record: 2 free perks on first taking this sponsor; Coffin Car: +1 extra Ignition Token' },
       { sponsor: 'Beverly', requirement: 'The team is a single Common vehicle', perk: 'Ghost Riders: summon spectral motorbike allies; Soul Anchor / Vengeful Spirits apply while they are in play' }
      ];

      function renderStats() {
       const totalCrew = vehicles.reduce((sum, v) => sum + Number(v.crew), 0);
       const avgArmor = vehicles.length
         ? Math.round(vehicles.reduce((sum, v) => sum + Number(v.armour), 0) / vehicles.length)
         : 0;
       const peakGear = vehicles.length
         ? Math.max(...vehicles.map(v => Number(v.maxGear)))
         : 0;

       document.getElementById('vehicleCount').textContent = vehicles.length;
       document.getElementById('crewTotal').textContent = totalCrew;
       document.getElementById('armorAverage').textContent = avgArmor;
       document.getElementById('speedPeak').textContent = peakGear;
      }

      function getFormVehicleFromInputs() {
       const formData = new FormData(vehicleForm);
       const weapon = String(formData.get('weapon') || '').trim() || 'Custom';
       const notes = String(formData.get('notes') || '').trim();
       const specialRules = [weapon];

       if (notes && notes !== 'No extra notes') {
         specialRules.push(notes);
       }

       return {
         name: String(formData.get('name') || '').trim() || 'Unnamed rig',
         type: String(formData.get('chassis') || 'Buggy'),
         maxGear: Number(formData.get('speed')) || 1,
         handling: Number(formData.get('speed')) || 1,
         crew: Number(formData.get('crew')) || 1,
         weight: Number(formData.get('crew')) || 1,
         armour: Number(formData.get('armor')) || 1,
         hull: 8,
         buildSlots: 2,
         cost: 18,
         specialRules
       };
      }

      function resetFormToCreate() {
       editingVehicleIndex = null;
       vehicleForm.reset();
       document.getElementById('name').value = 'Freshly painted rig';
       document.querySelector('#vehicleForm button[type="submit"]').textContent = 'Add to roster';
      }

      function renderVehicles() {
       const emptyState = vehicles.length === 0
         ? '<div class="vehicle-card"><h3>Garage empty</h3><p>No vehicles in the garage yet. Add one from the form.</p></div>'
         : '';

       const cardMarkup = vehicles
         .map((vehicle, index) => `
           <article class="vehicle-card">
             <div class="badge">${vehicle.cost} cans</div>
             <h3>${vehicle.name}</h3>
             <div class="meta">${vehicle.type}</div>
             <div>Base slots: ${vehicle.buildSlots} • Hull ${vehicle.hull}</div>
             <div class="chip-row">
               <span class="chip">Crew ${vehicle.crew}</span>
               <span class="chip">Armor ${vehicle.armour}</span>
               <span class="chip">Weight ${vehicle.weight}</span>
               <span class="chip">Gear ${vehicle.maxGear}</span>
             </div>
             <p>${vehicle.specialRules.length ? vehicle.specialRules.join(', ') : 'No special rules'}</p>
             <div class="action-row">
               <button class="edit-btn" type="button" data-index="${index}">Edit</button>
               <button class="delete-btn" type="button" data-index="${index}">Delete</button>
             </div>
           </article>
         `)
         .join('');

       const sponsorMarkup = `
         <div class="sponsor-strip">
           <h4>Sponsor requirements</h4>
           <div class="sponsor-list">
             ${sponsorCatalog.map((sponsor) => `<div><strong>${sponsor.sponsor}</strong> — ${sponsor.requirement}</div>`).join('')}
           </div>
         </div>
       `;

       vehicleCards.innerHTML = emptyState + cardMarkup + sponsorMarkup;
       renderStats();
      }

      document.getElementById('printRaceSheet').addEventListener('click', () => {
       window.print();
      });

      vehicleCards.addEventListener('click', (event) => {
       const editButton = event.target.closest('.edit-btn');
       if (editButton) {
         const index = Number(editButton.dataset.index);
         if (Number.isNaN(index)) return;

         const vehicle = vehicles[index];
         if (!vehicle) return;

         editingVehicleIndex = index;
         document.getElementById('name').value = vehicle.name;
         document.getElementById('chassis').value = vehicle.type;
         document.getElementById('crew').value = vehicle.crew;
         document.getElementById('armor').value = vehicle.armour;
         document.getElementById('speed').value = vehicle.maxGear;
         document.getElementById('weapon').value = vehicle.specialRules[0] || '';
         document.getElementById('notes').value = vehicle.specialRules.slice(1).join(', ') || 'No extra notes';
         document.querySelector('#vehicleForm button[type="submit"]').textContent = 'Save vehicle';
         return;
       }

       const deleteButton = event.target.closest('.delete-btn');
       if (!deleteButton) return;

       const index = Number(deleteButton.dataset.index);
       if (Number.isNaN(index)) return;

       vehicles.splice(index, 1);
       saveVehicles();
       renderVehicles();
       if (editingVehicleIndex === index || editingVehicleIndex === null) {
         resetFormToCreate();
       }
      });

      vehicleForm.addEventListener('submit', (event) => {
       event.preventDefault();

       const formVehicle = getFormVehicleFromInputs();

       if (editingVehicleIndex !== null) {
         vehicles[editingVehicleIndex] = formVehicle;
       } else {
         vehicles.unshift(formVehicle);
       }

       saveVehicles();
       renderVehicles();
       resetFormToCreate();
      });

      renderVehicles();
      resetFormToCreate();
    </script>
  </body>
</html>
